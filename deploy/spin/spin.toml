spin_manifest_version = 2

[application]
name = "herald"
version = "0.0.0"

[[trigger.http]]
route = "/..."
component = "herald"

[component.herald]
source = "../../target/wasm32-wasip2/release/herald_wasi.wasm"
files = [{ source = ".", destination = "/" }]
allowed_outbound_hosts = ["https://*:*"]
sqlite_databases = ["default"]
environment = { HERALD_HOST = "spin", HERALD_CONFIG = "/herald.toml" }
