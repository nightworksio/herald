apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: herald
    includeSelectors: true
resources:
  - deployment.yaml
  - service.yaml
  - pvc.yaml
configMapGenerator:
  - name: herald-config
    files:
      - herald.toml
images:
  - name: ghcr.io/nightworksio/herald
    newTag: "0"
