apiVersion: apps/v1
kind: Deployment
metadata:
  name: herald
spec:
  replicas: 1
  strategy:
    type: Recreate
  template:
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: herald
          image: ghcr.io/nightworksio/herald
          args: ["server"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/herald
              readOnly: true
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            - name: state
              mountPath: /var/lib/herald
      volumes:
        - name: config
          configMap:
            name: herald-config
        - name: secrets
          secret:
            secretName: herald-secrets
            optional: true
        - name: state
          persistentVolumeClaim:
            claimName: herald-state
