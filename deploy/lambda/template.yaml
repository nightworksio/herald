AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: herald as an AWS Lambda function on its own runtime

Parameters:
  Rounds:
    Type: String
    Default: rate(5 minutes)
  Table:
    Type: String
    Default: herald
  Memory:
    Type: Number
    Default: 256
    MinValue: 128
    MaxValue: 10240
  Timeout:
    Type: Number
    Default: 900
    MinValue: 1
    MaxValue: 900
  LogRetention:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, 3653]
  Concurrency:
    Type: String
    Default: ""
    Description: The invocations that may run at once; unreserved where empty.

Conditions:
  Reserved: !Not [!Equals [!Ref Concurrency, ""]]

Resources:
  Logs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${Herald}
      RetentionInDays: !Ref LogRetention
  Herald:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Ref AWS::StackName
      CodeUri: .
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures: [arm64]
      MemorySize: !Ref Memory
      Timeout: !Ref Timeout
      ReservedConcurrentExecutions: !If [Reserved, !Ref Concurrency, !Ref AWS::NoValue]
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}
      Events:
        Rounds:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: !Ref Rounds

Outputs:
  Url:
    Value: !GetAtt HeraldUrl.FunctionUrl
