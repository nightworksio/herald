{{- if and (not .Values.secrets.existingSecret) .Values.secrets.values }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "herald.secretName" . }}
  labels:
    {{- include "herald.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $name, $value := .Values.secrets.values }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
{{- end }}
