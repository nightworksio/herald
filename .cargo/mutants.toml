# Every skip is written here with its reason beside it (ADR-0008).
test_tool = "nextest"
# The recorders run by hand against the real platforms, never in the suite.
exclude_globs = [
    "crates/*/examples/**",
    # A component's and a service's wire handling is proven end to end on its host
    # by deploy/tests/compute.test.mjs, which cargo-mutants has no way to run. What
    # they decide lives in herald-compose, whose tests judge it.
    "crates/herald-wasi/src/component/handler.rs",
    "crates/herald-wasi/src/component/served.rs",
    "crates/herald-wasi/src/component/spin.rs",
    "crates/herald-fastly/src/compute/mod.rs",
    # The conformance harness is built only with the `conformance` feature, which no
    # release carries, and is judged by deploy/tests/worker.test.mjs on a Durable Object.
    "crates/herald-wasm/src/js/conformance.rs",
]
# A host's clock, signer and verifier hold nothing, so a fresh one is the same one.
exclude_re = [
    "impl Host for (Native<'_>|JsHost|WasiHost|FastlyHost)>::(clock|signer|verifier) ",
    # Each kind a store keeps none of is answered by herald-ports' `Unkept` whatever the store, so no store fails the probes of them; the probes themselves are judged by the suite's tests.
    "herald-testing/src/conformance/unkept\\.rs:\\d+:\\d+: replace unkept with \\(\\)",
    # A Compute service's secrets are a unit struct reading one store, so a fresh one is the same one.
    "impl Host for FastlyHost>::secrets ",
    # A destination's platform waits the default waits unless its kind names its own.
    "DestinationConfig::platform_waits -> Waits with Default::default\\(\\)",
    # A store names no secret beside its key unless its kind says so, and `Vec::new()` is `vec![]`.
    "StoreConfig::named -> Vec<&str> with vec!\\[\\]",
    # The source, store, destination and route schemas name a definition every kind's own schema replaces.
    "impl JsonSchema for (SourceSchema|StoreSchema|DestinationSchema|RouteSchema)>::json_schema ",
]
