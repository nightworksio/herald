# Every skip is written here with its reason beside it (ADR-0008).
test_tool = "nextest"
# The recorders run by hand against the real platforms, never in the suite.
exclude_globs = [
    "crates/*/examples/**",
    # A component's and a service's wire handling is proven end to end on its host
    # by deploy/tests/compute.test.mjs, which cargo-mutants has no way to run. What
    # they decide lives in herald-compose, whose tests judge it.
    "crates/herald-wasi/src/component/handler.rs",
    "crates/herald-wasi/src/component/served.rs",
    "crates/herald-wasi/src/component/spin.rs",
    "crates/herald-fastly/src/compute/mod.rs",
    # The conformance harness is built only with the `conformance` feature, which no
    # release carries, and is judged by deploy/tests/worker.test.mjs on a Durable Object.
    "crates/herald-wasm/src/js/conformance.rs",
]
# A host's clock and verifier hold nothing, and its signer holds only the key pairs it parsed, so a fresh one signs the same.
exclude_re = [
    "impl Host for (Native<'_>|JsHost|WasiHost|FastlyHost)>::(clock|signer|verifier) ",
    # Each kind a store keeps none of is answered by herald-ports' `Unkept` whatever the store, so no store fails the probes of them; the probes themselves are judged by the suite's tests.
    "herald-testing/src/conformance/unkept\\.rs:\\d+:\\d+: replace unkept with \\(\\)",
    # A component reaches Spin's llm only in its `spin` build, which cargo-mutants does not build, so no test can see a mutant of it.
    "impl Host for WasiHost>::inference ",
    # A Compute service's secrets are a unit struct reading one store, so a fresh one is the same one.
    "impl Host for FastlyHost>::secrets ",
    # A destination's platform waits the default waits unless its kind names its own.
    "DestinationConfig::platform_waits -> Waits with Default::default\\(\\)",
    # A store names no secret beside its key unless its kind says so, and `Vec::new()` is `vec![]`.
    "StoreConfig::named -> Vec<&str> with vec!\\[\\]",
    # A herald feed names no secret of its own, and a feed or push places every route as it is, and `Vec::new()` is `vec![]`.
    "impl DestinationConfig for FeedOptions>::secret_refs -> Vec<&SecretRef> with vec!\\[\\]",
    # A destination reads no secret beside its credential unless its kind says so, and `Vec::new()` is `vec![]`.
    "DestinationConfig::reads -> Vec<&SecretRef> with vec!\\[\\]",
    "impl DestinationKind for (HeraldKind|PushKind)>::placed -> Vec<Fault> with vec!\\[\\]",
    # A source pulling another herald's feed takes every kind the config declares rather than a list of its own, and `Vec::new()` is `vec![]`.
    "impl SourceConfig for HeraldOptions>::kinds -> Vec<Kind> with vec!\\[\\]",
    # A source says nothing to the doctor unless its kind says so, and `Vec::new()` is `vec![]`.
    "SourceConfig::notes -> Vec<&'static str> with vec!\\[\\]",
    # A source says nothing of CODEOWNERS to the doctor unless its kind reads areas from it, and `Vec::new()` is `vec![]`.
    "SourceConfig::codeowners_notes -> Vec<String> with vec!\\[\\]",
    # A poll and an owner ask only their API's origin unless their kind names more bases, and an empty slice is an empty slice.
    "(Expand|Poll)::bases -> &\\[String\\] with Vec::leak\\(Vec::new\\(\\)\\)",
    # A source or member stands for no repository unless its kind names one, and `None` is `None`.
    "(SourceConfig|Expand)::standing -> Option<Standing> with None",
    # A source remembers only its newest identities, and no store fits it, unless its kind says otherwise; a store bounds no record unless its kind does; and `None` is `None`.
    "(SourceConfig::remembers -> Option<Remembers>|SourceConfig::fitted -> Option<Source>|StoreConfig::most_record -> Option<usize>) with None",
    # A source names no signal its events carry unless its kind says so, and `Vec::new()` is `vec![]`.
    "SourceConfig::signals -> Vec<herald_core::Signal> with vec!\\[\\]",
    # An owner polls one member a request unless its kind batches them, and `1.try_into().unwrap()` is `NonZeroUsize::MIN`.
    "Expand::batch -> NonZeroUsize with 1\\.try_into\\(\\)\\.unwrap\\(\\)",
    # A source reads as no GitHub App unless its kind says so, and the default is `None`.
    "SourceConfig::installed -> Option<Installed<'_>> with None",
    # A source lists its owner each round unless its kind keeps membership by push, and the default is `false`.
    "SourceConfig::pushed -> bool with false",
    # A source names no route for some of its events unless its kind says so, and `Vec::new()` is `vec![]`.
    "SourceConfig::routed -> Vec<\\(String, String\\)> with vec!\\[\\]",
    # A member names no route of its own unless its kind says so, and `Reach::default()` is `Default::default()`.
    "Expand::reach -> Reach with Default::default\\(\\)",
    # A source names no project unless its kind says so, and `Vec::new()` is `vec![]`.
    "SourceConfig::projects -> Vec<String> with vec!\\[\\]",
    # A store's options set no key above its default unless its kind says so, and `Vec::new()` is `vec![]`.
    "StoreConfig::loosened -> Vec<\\(&'static str, &'static str\\)> with vec!\\[\\]",
    # The source, store, destination, route and board schemas name a definition every kind's own schema replaces.
    "impl JsonSchema for (SourceSchema|StoreSchema|DestinationSchema|RouteSchema|BoardSchema)>::json_schema ",
    # A role's base is @everyone's bits with its own; @everyone holding Administrator or View Channel either returned already or has View Channel cleared by @everyone's overwrite right after, so a bit both hold never changes who may view.
    "herald-dest-discord/src/audience\\.rs:\\d+:\\d+: replace \\| with \\^ in viewing$",
    # Skipping index * 1 routes in place of index + 1 adds only a route paired with itself, whose two surfaces always agree, so no note is ever added.
    "herald-flows/src/doctor/views\\.rs:\\d+:\\d+: replace \\+ with \\* in advised_notes$",
    # A preset's text is placed past the end of the one before it, and each mistake in it is found by the region holding its start; a region's end read as its start times its length only widens the gap before the next, which no offset falls in.
    "herald-config/src/load/presets\\.rs:\\d+:24: replace \\+ with \\* in Loader<'_>::tables$",
    # A moved span's end, moved by a product in place of a sum, still lies past every span within it, and a mistake is placed by its span's start, so nothing told changes.
    "herald-config/src/load/presets\\.rs:\\d+:31: replace \\+ with \\* in moved$",
]
