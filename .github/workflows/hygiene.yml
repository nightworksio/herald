# Spelling, links, Markdown, the workflows and the line cap, over the whole
# tree. Each tool reads its configuration from the repository's root.
name: hygiene

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A pull request pushed again cancels the run on its old head, and a push to
# main cancels the run of the push before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # typos.toml turns hidden files on, so `.docs` and `.github` are read.
  typos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1

  # lychee.toml turns hidden files on and holds the accepted status codes.
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --config lychee.toml .
          fail: true
          failIfEmpty: true

  # markdownlint-cli2 matches dot-directories, so `**` reaches `.docs`. The
  # rules are in .markdownlint.jsonc.
  markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: |
            **/*.md
            !target/**

  # The CLI rather than an action: pinned by version and by the SHA-256 its
  # release lists in actionlint_<version>_checksums.txt.
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL --proto '=https' --tlsv1.2 --retry 3 --retry-delay 2 --retry-all-errors \
            -o "${RUNNER_TEMP}/actionlint.tar.gz" "$url"
          sha256sum --check --strict <<<"${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/actionlint.tar.gz"
          tar xzf "${RUNNER_TEMP}/actionlint.tar.gz" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint"

  # The workflows and Dependabot's configuration, audited for the ways a
  # workflow is attacked. The release binary, pinned by version and by the
  # SHA-256 GitHub lists for the asset. It runs online with the job's read-only
  # token, so the audits that ask GitHub about a pinned action run too.
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ZIZMOR_VERSION: "1.30.1"
      ZIZMOR_SHA256: "e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL --proto '=https' --tlsv1.2 --retry 3 --retry-delay 2 --retry-all-errors \
            -o "${RUNNER_TEMP}/zizmor.tar.gz" "$url"
          sha256sum --check --strict <<<"${ZIZMOR_SHA256}  ${RUNNER_TEMP}/zizmor.tar.gz"
          tar xzf "${RUNNER_TEMP}/zizmor.tar.gz" -C "${RUNNER_TEMP}" zizmor
          "${RUNNER_TEMP}/zizmor" .

  # No tracked file is longer than 1000 lines. Lockfiles and images are not
  # counted.
  lines:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: .github/scripts/line-cap.sh

  # The deciding half of the release script (ADR-0012).
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover .github/scripts
