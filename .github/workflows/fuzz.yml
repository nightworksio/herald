# Every fuzz target, briefly on each pull request and push to main, and for
# longer every night with its corpus kept between runs (ADR-0008).
name: fuzz

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ contains(fromJSON('["pull_request","push"]'), github.event_name) && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The fuzz harness builds with a sanitizer, which needs nightly. Pinned, so a
  # nightly that breaks the build is a reviewed bump rather than a red morning.
  RUSTUP_TOOLCHAIN: nightly-2026-10-29

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [markup, chunk, forge]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - run: .github/scripts/install-tool.sh cargo-fuzz
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - env:
          TARGET: ${{ matrix.target }}
          SECONDS_TO_RUN: ${{ github.event_name == 'schedule' && '1800' || '60' }}
        working-directory: fuzz
        run: cargo fuzz run --target x86_64-unknown-linux-gnu "$TARGET" -- -max_total_time="$SECONDS_TO_RUN" -dict=herald.dict
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts
          retention-days: 7

  fuzzed:
    needs: fuzz
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULT: ${{ needs.fuzz.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "::error::A fuzz target ended ${RESULT}; its fuzz-artifacts artifact holds the input that failed."
            exit 1
          fi
