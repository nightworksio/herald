[package]
name = "herald-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
herald-compose = { path = "../crates/herald-compose" }
herald-config = { path = "../crates/herald-config" }
herald-core = { path = "../crates/herald-core" }
herald-dest-discord = { path = "../crates/herald-dest-discord" }
herald-dest-matrix = { path = "../crates/herald-dest-matrix" }
herald-dest-slack = { path = "../crates/herald-dest-slack" }
herald-ports = { path = "../crates/herald-ports" }
herald-sources-app = { path = "../crates/herald-sources-app" }
herald-sources-feed = { path = "../crates/herald-sources-feed" }
herald-sources-forge = { path = "../crates/herald-sources-forge" }
herald-sources-registry = { path = "../crates/herald-sources-registry" }
herald-wire = { path = "../crates/herald-wire" }
serde_json = "1"
jiff = { version = "0.2", default-features = false, features = ["std"] }
libfuzzer-sys = "0.4"
pulldown-cmark = { version = "0.13", default-features = false }

[workspace]
members = ["."]

[[bin]]
name = "markup"
path = "fuzz_targets/markup.rs"
test = false
doc = false
bench = false

[[bin]]
name = "chunk"
path = "fuzz_targets/chunk.rs"
test = false
doc = false
bench = false

[[bin]]
name = "forge"
path = "fuzz_targets/forge.rs"
test = false
doc = false
bench = false

[[bin]]
name = "registry"
path = "fuzz_targets/registry.rs"
test = false
doc = false
bench = false

[[bin]]
name = "feed"
path = "fuzz_targets/feed.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config"
path = "fuzz_targets/config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "inbound"
path = "fuzz_targets/inbound.rs"
test = false
doc = false
bench = false

[[bin]]
name = "app"
path = "fuzz_targets/app.rs"
test = false
doc = false
bench = false

[[bin]]
name = "commands"
path = "fuzz_targets/commands.rs"
test = false
doc = false
bench = false
