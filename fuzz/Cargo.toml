[package]
name = "herald-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
herald-config = { path = "../crates/herald-config" }
herald-core = { path = "../crates/herald-core" }
herald-ports = { path = "../crates/herald-ports" }
herald-sources-forge = { path = "../crates/herald-sources-forge" }
herald-sources-registry = { path = "../crates/herald-sources-registry" }
libfuzzer-sys = "0.4"

[workspace]
members = ["."]

[[bin]]
name = "markup"
path = "fuzz_targets/markup.rs"
test = false
doc = false
bench = false

[[bin]]
name = "chunk"
path = "fuzz_targets/chunk.rs"
test = false
doc = false
bench = false

[[bin]]
name = "forge"
path = "fuzz_targets/forge.rs"
test = false
doc = false
bench = false

[[bin]]
name = "registry"
path = "fuzz_targets/registry.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config"
path = "fuzz_targets/config.rs"
test = false
doc = false
bench = false
