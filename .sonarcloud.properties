# SonarCloud automatic analysis. The CI's loopback fixture server and the
# scripts' unit tests are test code: they run only in CI, against recordings.
sonar.sources=.
sonar.exclusions=.github/scripts/fixture_server.py,.github/scripts/test_*.py
sonar.tests=.github/scripts
sonar.test.inclusions=.github/scripts/fixture_server.py,.github/scripts/test_*.py
