[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2024-0384", reason = "instant is unmaintained, with no flaw reported; wstd 0.6.8, the newest, holds it through futures-lite 1 and fastrand 1, in herald-wasi's wasm32-wasip2 build alone" },
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
skip = [
  { crate = "syn@2", reason = "proc macros move from syn 2 to syn 3 crate by crate; jiff-static and jni still build on syn 2" },
  { crate = "windows-sys@0.52", reason = "ring 0.17 builds on windows-sys 0.52, for Windows targets only" },
  { crate = "base64@0.22", reason = "postgres-protocol 0.6, under tokio-postgres for the postgres store, still builds on base64 0.22" },
  { crate = "fallible-iterator@0.2", reason = "tokio-postgres 0.7 and its protocol crates build on fallible-iterator 0.2; rusqlite has moved to 0.3" },
  { crate = "const-oid@0.9", reason = "der 0.7 and x509-cert 0.2 build on const-oid 0.9; the RustCrypto 0.11 digests have moved to 0.10" },
  { crate = "getrandom@0.2", reason = "ring 0.17 builds on getrandom 0.2" },
  { crate = "wasi@0.11", reason = "getrandom 0.2, under ring 0.17, builds on wasi 0.11" },
  { crate = "bitflags@1", reason = "fastly-shared and fastly-sys 0.13 build on bitflags 1; only herald-fastly's wasm32-wasip1 build holds it" },
  { crate = "sha2@0.9", reason = "fastly 0.13 builds on sha2 0.9; only herald-fastly's wasm32-wasip1 build holds it" },
  { crate = "digest@0.9", reason = "sha2 0.9, under fastly 0.13, builds on digest 0.9" },
  { crate = "block-buffer@0.9", reason = "sha2 0.9, under fastly 0.13, builds on block-buffer 0.9" },
  { crate = "cpufeatures@0.2", reason = "sha2 0.9, under fastly 0.13, builds on cpufeatures 0.2" },
  { crate = "syn@1", reason = "fastly-macros 0.13 builds on syn 1" },
  { crate = "thiserror@1", reason = "fastly 0.13 builds on thiserror 1" },
  { crate = "thiserror-impl@1", reason = "thiserror 1, under fastly 0.13, builds on thiserror-impl 1" },
  { crate = "wit-bindgen@0.61", reason = "fastly-sys 0.13 builds on wit-bindgen 0.61" },
  { crate = "wasip2@1", reason = "wstd 0.6 builds on wasip2 1, and fastly-sys on wasip2 2" },
  { crate = "wit-bindgen@0.57", reason = "wasip2 1, under wstd 0.6, builds on wit-bindgen 0.57" },
]
deny = [
  { crate = "amplitude", reason = "reports on the person running it" },
  { crate = "aptabase", reason = "reports on the person running it" },
  { crate = "bugsnag", reason = "reports on the person running it" },
  { crate = "countly", reason = "reports on the person running it" },
  { crate = "datadog", reason = "reports on the person running it" },
  { crate = "google-analytics", reason = "reports on the person running it" },
  { crate = "libhoney", reason = "reports on the person running it" },
  { crate = "mixpanel", reason = "reports on the person running it" },
  { crate = "opentelemetry", reason = "reports on the person running it" },
  { crate = "posthog", reason = "reports on the person running it" },
  { crate = "rollbar", reason = "reports on the person running it" },
  { crate = "segment", reason = "reports on the person running it" },
  { crate = "sentry", reason = "reports on the person running it" },
  { crate = "snowplow", reason = "reports on the person running it" },
  { crate = "abi_stable", reason = "runs code it was handed" },
  { crate = "dlopen", reason = "runs code it was handed" },
  { crate = "libloading", reason = "runs code it was handed" },
  { crate = "sharedlib", reason = "runs code it was handed" },
  { crate = "boa_engine", reason = "runs code it was handed" },
  { crate = "deno_core", reason = "runs code it was handed" },
  { crate = "dyon", reason = "runs code it was handed" },
  { crate = "extism", reason = "runs code it was handed" },
  { crate = "gluon", reason = "runs code it was handed" },
  { crate = "hlua", reason = "runs code it was handed" },
  { crate = "koto", reason = "runs code it was handed" },
  { crate = "lua", reason = "runs code it was handed" },
  { crate = "mlua", reason = "runs code it was handed" },
  { crate = "quickjs", reason = "runs code it was handed" },
  { crate = "rhai", reason = "runs code it was handed" },
  { crate = "rlua", reason = "runs code it was handed" },
  { crate = "rquickjs", reason = "runs code it was handed" },
  { crate = "rustpython", reason = "runs code it was handed" },
  { crate = "starlark", reason = "runs code it was handed" },
  { crate = "v8", reason = "runs code it was handed" },
  { crate = "wasm3", reason = "runs code it was handed" },
