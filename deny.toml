[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"
# LLVM's libFuzzer, which the fuzz targets alone link; no herald build ships it.
exceptions = [
  { crate = "libfuzzer-sys", allow = ["NCSA"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
