[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nightworksio/herald"
authors = ["NightWorksIO"]
publish = false

[workspace.dependencies]
herald-core = { path = "crates/herald-core" }
herald-dest-discord = { path = "crates/herald-dest-discord" }
herald-native = { path = "crates/herald-native" }
herald-ports = { path = "crates/herald-ports" }
herald-testing = { path = "crates/herald-testing" }
cargo_metadata = "0.23"
minijinja = { version = "3", default-features = false, features = ["builtins", "fuel", "multi_template", "serde"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
unicode-segmentation = "1"
url = "2"
jiff = { version = "0.2", default-features = false, features = ["std", "serde"] }
pollster = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
proptest = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11", default-features = false }
tempfile = "3"
tokio = { version = "1", default-features = false }
webpki-roots = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"

[profile.dev]
debug = "line-tables-only"
