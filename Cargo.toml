[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nightworksio/herald"
authors = ["NightWorksIO"]
publish = false

[workspace.dependencies]
herald-core = { path = "crates/herald-core" }
cargo_metadata = "0.23"
sha2 = { version = "0.11", default-features = false }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"

[profile.dev]
debug = "line-tables-only"
