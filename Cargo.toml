[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nightworksio/herald"
authors = ["NightWorksIO"]
publish = false

[workspace.dependencies]
base64 = "0.23"
herald-aws = { path = "crates/herald-aws" }
herald-compose = { path = "crates/herald-compose" }
herald-config = { path = "crates/herald-config" }
herald-core = { path = "crates/herald-core" }
herald-dest-discord = { path = "crates/herald-dest-discord" }
herald-dest-fediverse = { path = "crates/herald-dest-fediverse" }
herald-dest-matrix = { path = "crates/herald-dest-matrix" }
herald-dest-slack = { path = "crates/herald-dest-slack" }
herald-flows = { path = "crates/herald-flows" }
herald-crypto = { path = "crates/herald-crypto" }
herald-environment = { path = "crates/herald-environment" }
herald-keys = { path = "crates/herald-keys" }
herald-spin = { path = "crates/herald-spin" }
herald-native = { path = "crates/herald-native" }
herald-ports = { path = "crates/herald-ports" }
herald-records = { path = "crates/herald-records" }
herald-server = { path = "crates/herald-server" }
herald-sources-app = { path = "crates/herald-sources-app" }
herald-sources-feed = { path = "crates/herald-sources-feed" }
herald-sources-forge = { path = "crates/herald-sources-forge" }
herald-sources-registry = { path = "crates/herald-sources-registry" }
herald-store-actions-cache = { path = "crates/herald-store-actions-cache" }
herald-store-d1 = { path = "crates/herald-store-d1" }
herald-store-deno-kv = { path = "crates/herald-store-deno-kv" }
herald-store-dynamodb = { path = "crates/herald-store-dynamodb" }
herald-store-durable-object = { path = "crates/herald-store-durable-object" }
herald-store-fastly-kv = { path = "crates/herald-store-fastly-kv" }
herald-store-git-branch = { path = "crates/herald-store-git-branch" }
herald-store-markers = { path = "crates/herald-store-markers" }
herald-store-postgres = { path = "crates/herald-store-postgres" }
herald-store-repo-variables = { path = "crates/herald-store-repo-variables" }
herald-store-sqlite = { path = "crates/herald-store-sqlite" }
herald-testing = { path = "crates/herald-testing" }
herald-wasm = { path = "crates/herald-wasm" }
herald-wire = { path = "crates/herald-wire" }
cargo_metadata = "0.23"
minijinja = { version = "3", default-features = false, features = ["builtins", "fuel", "multi_template", "serde"] }
quick-xml = { version = "0.42", default-features = false }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
unicode-segmentation = "1"
url = "2"
jiff = { version = "0.2", default-features = false, features = ["std", "serde"] }
pollster = "1"
ring = "0.17"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rusqlite = { version = "0.41", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
proptest = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.13"
sha2 = { version = "0.11", default-features = false }
tempfile = "3"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
tokio = { version = "1", default-features = false }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
tokio-postgres-rustls = "0.14"
webpki-roots = "1"
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"

[profile.dev]
debug = "line-tables-only"
