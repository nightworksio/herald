# CHANGELOG.md in Keep a Changelog's layout, from main's squash commits, one
# per pull request (ADR-0012). The release workflow writes each version's
# section, and the maintainer edits it before the tag.

[changelog]
header = """
# Changelog

Every release of nightworksio/herald. The layout is
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/), and the versions are
[Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim | upper_first }}
{%- endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = true
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?$"
topo_order = false
sort_commits = "oldest"
commit_parsers = [
  { field = "breaking", pattern = "true", group = "<!-- 0 -->Breaking" },
  { message = "^feat", group = "<!-- 1 -->Added" },
  { message = "^fix", group = "<!-- 2 -->Fixed" },
  { message = "^perf", group = "<!-- 3 -->Changed" },
]
