# Link checking, for the `links` job in .github/workflows/hygiene.yml.

# Hidden files are read, so the decision records under `.docs` are checked.
hidden = true
exclude_path = [".git", "target"]

exclude_loopback = true
# The README shows its logo by an absolute URL on main, so it renders off
# GitHub too; on a pull request that adds the file, main does not hold it yet.
exclude = ['^https://raw\.githubusercontent\.com/nightworksio/herald/main/']
max_retries = 3
retry_wait_time = 3

# What is not a broken link:
#   206  a partial response: the host answered, in pieces
#   429  the host asking to be asked less often
#   5xx  the host is unwell, which says nothing about whether the link is wrong
# A link that is wrong answers 404 or 410, and those still fail.
accept = ["200", "206", "429", "500..=599"]
