[package]
name = "herald"
description = "herald's CLI: announce what happened to the places people gather, from one herald.toml"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "herald"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
herald-config.workspace = true
herald-core.workspace = true
herald-flows.workspace = true
herald-native.workspace = true
herald-ports.workspace = true
herald-records.workspace = true
herald-sources-forge.workspace = true
herald-store-actions-cache.workspace = true
herald-store-git-branch.workspace = true
herald-store-repo-variables.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[dev-dependencies]
jiff.workspace = true
pollster.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
