[package]
name = "herald"
description = "herald's CLI: announce what happened to the places people gather, from one herald.toml"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "herald"
path = "src/main.rs"

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
base64.workspace = true
clap = { version = "4", features = ["derive", "env"] }
herald-aws.workspace = true
herald-compose.workspace = true
herald-config.workspace = true
herald-core.workspace = true
herald-dest-discord.workspace = true
herald-dest-matrix.workspace = true
herald-dest-slack.workspace = true
herald-flows.workspace = true
herald-kinds.workspace = true
herald-crypto.workspace = true
herald-environment.workspace = true
herald-native.workspace = true
herald-ports.workspace = true
herald-records.workspace = true
herald-server.workspace = true
herald-sources-app.workspace = true
herald-sources-forge.workspace = true
herald-store-actions-cache.workspace = true
herald-store-dynamodb.workspace = true
herald-store-git-branch.workspace = true
herald-store-markers.workspace = true
herald-store-postgres.workspace = true
herald-store-repo-variables.workspace = true
herald-store-sqlite.workspace = true
jiff.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "macros", "net", "rt", "signal"] }

[dev-dependencies]
base64.workspace = true
herald-dest-fediverse.workspace = true
herald-testing.workspace = true
pollster.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt"] }

[lints]
workspace = true
