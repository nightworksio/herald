# Spelling, for the `typos` job in .github/workflows/hygiene.yml.

[files]
# Hidden files are read, so `.docs` and `.github` are checked. `.git` holds
# compressed objects rather than text, so it comes back out.
ignore-hidden = false
extend-exclude = [".git/", "target/", "Cargo.lock", "LICENSE-APACHE", "LICENSE-MIT"]

[default]
# A commit's abbreviated or full hash is hex, not a word.
extend-ignore-re = ["\\b[0-9a-f]{7,40}\\b"]
